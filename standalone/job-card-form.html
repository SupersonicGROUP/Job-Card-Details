<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Card Details - Entry Form</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f2f4f8;
    margin: 0;
    padding: 20px 12px 60px;
  }

  .card {
    max-width: 520px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: #fff;
    padding: 22px 24px;
  }

  .header h1 {
    margin: 0;
    font-size: 19px;
  }

  .header p {
    margin: 4px 0 0;
    opacity: 0.85;
    font-size: 13px;
  }

  .form-area {
    padding: 20px 22px 4px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
  }

  .field label .required {
    color: #ea4335;
  }

  .input-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }

  .input-row input,
  .input-row textarea {
    flex: 1;
    width: 100%;
    padding: 11px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }

  .input-row textarea {
    min-height: 70px;
  }

  .input-row input:focus,
  .input-row textarea:focus {
    outline: none;
    border-color: #1a73e8;
  }

  .mic-btn {
    flex: 0 0 auto;
    width: 44px;
    border: 2px solid #e0e0e0;
    background: #fafafa;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }

  .mic-btn:hover {
    background: #eef4ff;
    border-color: #1a73e8;
  }

  .mic-btn.listening {
    background: #ea4335;
    border-color: #ea4335;
    color: #fff;
    animation: pulse 1.1s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(234,67,53,0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(234,67,53,0); }
    100% { box-shadow: 0 0 0 0 rgba(234,67,53,0); }
  }

  .submit-btn {
    display: block;
    width: calc(100% - 44px);
    margin: 10px 22px 22px;
    background: #1a73e8;
    color: #fff;
    border: none;
    padding: 15px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  .submit-btn:hover { opacity: 0.92; }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }

  .status-box {
    margin: 0 22px 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
  }

  .status-box.success {
    background: #e6f4ea;
    color: #1e7e34;
    border: 1px solid #b7e1c1;
  }

  .status-box.error {
    background: #fce8e6;
    color: #b3261e;
    border: 1px solid #f4c7c3;
  }

  .voice-note, .loading-note {
    font-size: 11px;
    color: #999;
    margin: 0 22px 10px;
  }

  .loading-note {
    padding: 22px;
    font-size: 14px;
  }
</style>
</head>
<body>

  <!-- ============================================
       CONFIG: Apps Script deploy karne ke baad jo
       "/exec" URL milta hai wahi neeche daalna hai.
       Sirf yahi line change karni padegi agar future
       me Apps Script redeploy ho aur URL badal jaaye
       (aam taur par "New version" se URL nahi badalta).
       ============================================ -->
  <script>
    var APPS_SCRIPT_URL = "https://script.google.com/a/macros/supersonicgroup.in/s/AKfycbxgBZ_UJD1DwaUGA8e3svQORWJpWL_Ratm5C49oA2zum6DIBE8ZSC1kP0atzahAfq4Q/exec";
  </script>

  <div class="card">
    <div class="header">
      <h1 id="formTitle">Job Card Details - Entry Form</h1>
      <p id="companyName">Supersonic Group</p>
    </div>

    <div id="loadingNote" class="loading-note">Form load ho raha hai...</div>
    <div id="formArea" class="form-area"></div>
    <div id="statusBox" class="status-box" style="display:none;"></div>
    <button id="submitBtn" class="submit-btn" type="button" style="display:none;">Save Entry</button>
  </div>

<script>
  var SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  var voiceSupported = !!SpeechRecognitionAPI;
  var FIELDS_CONFIG = [];
  var UNIT_SUGGESTIONS = [];

  // Voice input ek hi shared recognition object reuse karta hai (naya banane se
  // kai phone/browser pe pehle field ke baad wala mic silently fail ho jata tha,
  // kyunki purana speech-service theek se release nahi hota tha).
  var recognition = null;
  var isListening = false;
  var currentMicBtn = null;
  var currentInputEl = null;
  var currentIsNumberField = false;
  var currentBaseValue = "";
  var pendingStart = null;

  // ---- Apps Script se form config (fields) mangao ----
  function loadConfigAndBuildForm() {
    fetch(APPS_SCRIPT_URL + "?action=fields")
      .then(function (res) { return res.json(); })
      .then(function (cfg) {
        FIELDS_CONFIG = cfg.fields;
        UNIT_SUGGESTIONS = cfg.units || [];
        if (cfg.formTitle) document.getElementById("formTitle").textContent = cfg.formTitle;
        if (cfg.companyName) document.getElementById("companyName").textContent = cfg.companyName;
        document.getElementById("loadingNote").style.display = "none";
        document.getElementById("submitBtn").style.display = "block";
        buildForm();
      })
      .catch(function (err) {
        document.getElementById("loadingNote").textContent =
          "Form load nahi ho paya. Internet check karo, ya thodi der baad reload karo. (" + err.message + ")";
      });
  }

  // ---- Form ko FIELDS_CONFIG se banao ----
  function buildForm() {
    var container = document.getElementById("formArea");

    FIELDS_CONFIG.forEach(function (field) {
      var wrap = document.createElement("div");
      wrap.className = "field";

      var label = document.createElement("label");
      label.setAttribute("for", "f_" + field.key);
      label.innerHTML = field.label + (field.required ? ' <span class="required">*</span>' : "");
      wrap.appendChild(label);

      var row = document.createElement("div");
      row.className = "input-row";

      var input;
      if (field.type === "textarea") {
        input = document.createElement("textarea");
      } else {
        input = document.createElement("input");
        input.type = (field.type === "number") ? "number" : (field.type === "date" ? "date" : "text");
      }
      input.id = "f_" + field.key;
      input.dataset.key = field.key;

      if (field.type === "date") {
        var today = new Date();
        input.value = today.toISOString().slice(0, 10);
      }

      if (field.key === "unit" && UNIT_SUGGESTIONS.length) {
        var listId = "unitList";
        input.setAttribute("list", listId);
        if (!document.getElementById(listId)) {
          var datalist = document.createElement("datalist");
          datalist.id = listId;
          UNIT_SUGGESTIONS.forEach(function (u) {
            var opt = document.createElement("option");
            opt.value = u;
            datalist.appendChild(opt);
          });
          document.body.appendChild(datalist);
        }
      }

      row.appendChild(input);

      if (field.voice && voiceSupported) {
        var micBtn = document.createElement("button");
        micBtn.type = "button";
        micBtn.className = "mic-btn";
        micBtn.title = "Bolke type karo";
        micBtn.innerHTML = "&#127908;";
        micBtn.addEventListener("click", function () {
          toggleVoiceInput(micBtn, input, field.type === "number");
        });
        row.appendChild(micBtn);
      }

      wrap.appendChild(row);
      container.appendChild(wrap);
    });

    if (!voiceSupported) {
      var note = document.createElement("p");
      note.className = "voice-note";
      note.textContent = "Voice typing is chrome browser me hi kaam karta hai.";
      container.appendChild(note);
    }
  }

  // ---- Voice input (bolke type) ----
  // Ek hi recognition object banta hai (pehli baar mic dabane par), phir har
  // field usi ko reuse karta hai. Field badalne par pehle purane wale ko
  // properly stop hone dete hai (onend ka wait karke), tabhi naya start hota
  // hai - isse Android/Chrome me mic dusre-teesre field par bhi kaam karta hai.
  function ensureRecognition() {
    if (recognition) return recognition;

    recognition = new SpeechRecognitionAPI();
    recognition.lang = "en-IN";
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = function () {
      isListening = true;
      if (currentMicBtn) currentMicBtn.classList.add("listening");
    };

    recognition.onresult = function (event) {
      if (!currentInputEl) return;
      var transcript = "";
      for (var i = 0; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      if (currentIsNumberField) {
        var digits = transcript.replace(/[^0-9.]/g, "");
        currentInputEl.value = digits || currentInputEl.value;
      } else {
        currentInputEl.value = currentBaseValue + transcript;
      }
    };

    recognition.onerror = function (event) {
      console.error("Voice input error:", event.error);
      showStatus("Voice typing error: " + event.error, true);
    };

    recognition.onend = function () {
      isListening = false;
      if (currentMicBtn) currentMicBtn.classList.remove("listening");
      currentMicBtn = null;
      currentInputEl = null;

      if (pendingStart) {
        var next = pendingStart;
        pendingStart = null;
        startListening(next.micBtn, next.inputEl, next.isNumberField);
      }
    };

    return recognition;
  }

  function startListening(micBtn, inputEl, isNumberField) {
    currentMicBtn = micBtn;
    currentInputEl = inputEl;
    currentIsNumberField = isNumberField;
    currentBaseValue = inputEl.value ? inputEl.value + " " : "";
    try {
      ensureRecognition().start();
    } catch (err) {
      console.error("Voice input failed to start:", err);
      showStatus("Voice typing start nahi hua: " + err.message, true);
    }
  }

  function toggleVoiceInput(micBtn, inputEl, isNumberField) {
    ensureRecognition();

    if (isListening) {
      if (currentMicBtn === micBtn) {
        recognition.stop(); // toggle off - onend cleans up
      } else {
        pendingStart = { micBtn: micBtn, inputEl: inputEl, isNumberField: isNumberField };
        recognition.stop(); // onend will start the new field once old one fully ends
      }
    } else {
      startListening(micBtn, inputEl, isNumberField);
    }
  }

  // ---- Submit ----
  function collectFormData() {
    var data = {};
    FIELDS_CONFIG.forEach(function (field) {
      var el = document.getElementById("f_" + field.key);
      data[field.key] = el.value.trim();
    });
    return data;
  }

  function validateFormData(data) {
    for (var i = 0; i < FIELDS_CONFIG.length; i++) {
      var field = FIELDS_CONFIG[i];
      if (field.required && !data[field.key]) {
        return field.label + " bharna zaroori hai.";
      }
    }
    return null;
  }

  function showStatus(message, isError) {
    var box = document.getElementById("statusBox");
    box.textContent = message;
    box.className = "status-box " + (isError ? "error" : "success");
    box.style.display = "block";
  }

  function resetForm() {
    FIELDS_CONFIG.forEach(function (field) {
      var el = document.getElementById("f_" + field.key);
      if (field.type === "date") {
        el.value = new Date().toISOString().slice(0, 10);
      } else {
        el.value = "";
      }
    });
  }

  function onSubmitClick() {
    var data = collectFormData();
    var errorMsg = validateFormData(data);
    if (errorMsg) {
      showStatus(errorMsg, true);
      return;
    }

    var btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Saving...";

    // Content-Type: text/plain rakhna zaroori hai - isse browser preflight
    // (OPTIONS) request nahi bhejta, kyunki Apps Script OPTIONS handle nahi karta.
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(data)
    })
      .then(function (res) { return res.json(); })
      .then(function (result) {
        btn.disabled = false;
        btn.textContent = "Save Entry";
        if (result.success) {
          showStatus("Saved! S.No " + result.serialNo + " sheet me add ho gaya.", false);
          resetForm();
          document.getElementById("f_" + FIELDS_CONFIG[1].key).focus();
        } else {
          showStatus("Error: " + result.error, true);
        }
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = "Save Entry";
        showStatus("Save nahi hua, internet/connection check karo. (" + err.message + ")", true);
      });
  }

  document.getElementById("submitBtn").addEventListener("click", onSubmitClick);
  loadConfigAndBuildForm();
</script>
</body>
</html>
