<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f2f4f8;
    margin: 0;
    padding: 20px 12px 60px;
  }

  .card {
    max-width: 520px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: #fff;
    padding: 22px 24px;
  }

  .header h1 {
    margin: 0;
    font-size: 19px;
  }

  .header p {
    margin: 4px 0 0;
    opacity: 0.85;
    font-size: 13px;
  }

  .form-area {
    padding: 20px 22px 4px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
  }

  .field label .required {
    color: #ea4335;
  }

  .input-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }

  .input-row input,
  .input-row textarea {
    flex: 1;
    width: 100%;
    padding: 11px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }

  .input-row textarea {
    min-height: 70px;
  }

  .input-row input:focus,
  .input-row textarea:focus {
    outline: none;
    border-color: #1a73e8;
  }

  .mic-btn {
    flex: 0 0 auto;
    width: 44px;
    border: 2px solid #e0e0e0;
    background: #fafafa;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }

  .mic-btn:hover {
    background: #eef4ff;
    border-color: #1a73e8;
  }

  .mic-btn.listening {
    background: #ea4335;
    border-color: #ea4335;
    color: #fff;
    animation: pulse 1.1s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(234,67,53,0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(234,67,53,0); }
    100% { box-shadow: 0 0 0 0 rgba(234,67,53,0); }
  }

  .submit-btn {
    display: block;
    width: calc(100% - 44px);
    margin: 10px 22px 22px;
    background: #1a73e8;
    color: #fff;
    border: none;
    padding: 15px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  .submit-btn:hover { opacity: 0.92; }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }

  .status-box {
    margin: 0 22px 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
  }

  .status-box.success {
    background: #e6f4ea;
    color: #1e7e34;
    border: 1px solid #b7e1c1;
  }

  .status-box.error {
    background: #fce8e6;
    color: #b3261e;
    border: 1px solid #f4c7c3;
  }

  .voice-note {
    font-size: 11px;
    color: #999;
    margin: 0 22px 10px;
  }
</style>
